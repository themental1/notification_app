name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
        cache: true

    - name: Get dependencies
      run: flutter pub get

    - name: Validate Flutter Project
      run: |
        echo "=== Checking pubspec.yaml ==="
        test -f pubspec.yaml && echo "✓ pubspec.yaml exists" || echo "✗ pubspec.yaml missing"
        echo "=== Checking android/build.gradle ==="
        test -f android/build.gradle && echo "✓ android/build.gradle exists" || echo "✗ android/build.gradle missing"
        echo "=== Checking android/app/build.gradle ==="
        test -f android/app/build.gradle && echo "✓ android/app/build.gradle exists" || echo "✗ android/app/build.gradle missing"
        echo "=== Running flutter analyze ==="
        flutter analyze --no-fatal-infos || true

    - name: Debug Info
      run: |
        echo "=== Flutter Info ===" 
        flutter doctor -v
        echo "=== Gradle Version ===" 
        cd android && ./gradlew --version || gradle --version
        echo "=== Kotlin Compiler ===" 
        kotlinc -version || true

    - name: Generate debug keystore (for debug builds)
      if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
      run: |
        keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

    - name: Setup release keystore (for release builds)
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p /home/runner/keystore
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > /home/runner/keystore/release.keystore
        chmod 600 /home/runner/keystore/release.keystore

    - name: Build Debug APK
      if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
      run: flutter build apk --debug --verbose 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}

    - name: Build Release APK
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_KEYSTORE_PATH: /home/runner/keystore/release.keystore
        KEYSTORE_STOREPASS: ${{ secrets.KEYSTORE_STOREPASS }}
        KEYSTORE_KEYPASS: ${{ secrets.KEYSTORE_KEYPASS }}
        KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      run: flutter build apk --release --verbose 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}

    - name: Check APK Output
      if: always()
      run: find build/app/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build-output.log

    - name: Upload Debug APK Artifact
      if: success() && !startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: build/app/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK Artifact
      if: success() && startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/apk/release/app-release.apk

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/') && success()
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

