name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
        cache: true

    - name: Preserve custom android files (if they exist)
      run: |
        if [ -d "android" ]; then
          mkdir -p /tmp/custom_android_backup
          if [ -d "android/app/src/main/kotlin" ]; then
            cp -r android/app/src/main/kotlin /tmp/custom_android_backup/
          fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/custom_android_backup/
          fi
          if [ -f "android/app/build.gradle" ]; then
            cp android/app/build.gradle /tmp/custom_android_backup/
          fi
        fi

    - name: Create fresh Flutter project (for base android structure only)
      run: |
        flutter create --org com.themental1 --project-name notification_app /tmp/fresh_app
        if [ ! -d "android" ]; then
          cp -r /tmp/fresh_app/android .
        fi
        cp -r lib/. /tmp/fresh_app/lib/
        cp pubspec.yaml /tmp/fresh_app/pubspec.yaml

    - name: Restore custom android files
      run: |
        if [ -d "/tmp/custom_android_backup" ]; then
          if [ -d "/tmp/custom_android_backup/kotlin" ]; then
            cp -r /tmp/custom_android_backup/kotlin/* android/app/src/main/kotlin/ 2>/dev/null || true
          fi
          if [ -f "/tmp/custom_android_backup/AndroidManifest.xml" ]; then
            cp /tmp/custom_android_backup/AndroidManifest.xml android/app/src/main/
          fi
          if [ -f "/tmp/custom_android_backup/build.gradle" ]; then
            cp /tmp/custom_android_backup/build.gradle android/app/
          fi
        fi

    - name: Get dependencies
      run: flutter pub get

    - name: Validate Flutter Project
      run: |
        echo "=== Checking pubspec.yaml ==="
        test -f pubspec.yaml && echo "✓ pubspec.yaml exists" || echo "✗ pubspec.yaml missing"
        echo "=== Checking android/build.gradle ==="
        test -f android/build.gradle && echo "✓ android/build.gradle exists" || echo "✗ android/build.gradle missing"
        echo "=== Checking android/app/build.gradle ==="
        test -f android/app/build.gradle && echo "✓ android/app/build.gradle exists" || echo "✗ android/app/build.gradle missing"
        echo "=== Running flutter analyze ==="
        flutter analyze --no-fatal-infos || true

    - name: Debug Info
      run: |
        echo "=== Flutter Info ===" 
        flutter doctor -v
        echo "=== Gradle Version ===" 
        cd android && ./gradlew --version || gradle --version
        echo "=== Kotlin Compiler ===" 
        kotlinc -version || true

    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore android/app/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

    - name: Build APK
      run: flutter build apk --debug --verbose 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}

    - name: Check APK Output
      if: always()
      run: find build/app/outputs -name "*.apk" 2>/dev/null || echo "No APK found"

    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build-output.log

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: build/app/outputs/apk/debug/app-debug.apk

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
