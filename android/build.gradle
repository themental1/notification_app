buildscript {
    ext.kotlin_version = '1.8.0'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion = 34
            }
        }
    }
}
