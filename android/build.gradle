allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDeps = function() { }
}

def flutterRoot = rootProject.projectDir.parentFile.parentFile

task clean(type: Delete) {
    delete rootProject.buildDir
}
