pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(rootDir.absolutePath + "/local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withInputStream { properties.load(it) }
        }
        def flutterSdkPathString = properties.getProperty("flutter.sdk")
        if (flutterSdkPathString == null) {
            throw new GradleException("flutter.sdk not set in local.properties")
        }
        return flutterSdkPathString
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

include ':app'

def flutterProjectRoot = rootProject.projectDir.parentFile.parentFile
assert flutterProjectRoot.isDirectory()
